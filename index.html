<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart MUET Guide v2 - Your MUET Band Starts Here">
  <title>Smart MUET Guide | Practice Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

  <!-- CSS - Order is Critical! -->
  <link rel="stylesheet" href="css/muet-guide.css">
  <link rel="stylesheet" href="css/display-standard.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="page-index">
  <div class="app">
    <!-- HEADER -->
    <header class="brandbar">
      <img src="assets/logo.svg" alt="Smart MUET Guide" class="brand-logo">
      <div class="brand-text">
        <strong>Smart MUET Guide</strong>
        <small>ELU · POLIPD</small>
      </div>
      <button class="avatar-btn" id="profileBtn">JM</button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="page">
      <h1>Welcome to Smart MUET Guide</h1>
      <p>Your comprehensive MUET practice platform with 4 complete vaults and guided learning paths.</p>

      <!-- Vault Selector -->
      <section class="vault-section">
        <h2>Select Your Practice Vault</h2>
        <div id="vault-selector"></div>
      </section>

      <!-- Quick Links -->
      <section class="quick-links">
        <a href="muet-hub.html" class="btn">Start Practicing</a>
        <a href="guidance.html" class="btn">View Guidance</a>
        <a href="progress.html" class="btn">Check Progress</a>
      </section>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item active">
        <img src="assets/icon-home.svg" alt="">
        <span>Home</span>
      </a>
      <a href="progress.html" class="nav-item">
        <img src="assets/icon-progress.svg" alt="">
        <span>Progress</span>
      </a>
      <a href="guidance.html" class="nav-item">
        <img src="assets/icon-guidance.svg" alt="">
        <span>Guidance</span>
      </a>
      <a href="muet-hub.html" class="nav-item">
        <img src="assets/icon-practice.svg" alt="">
        <span>Practice</span>
      </a>
      <a href="settings.html" class="nav-item">
        <img src="assets/icon-settings.svg" alt="">
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <!-- VAULT SOURCES AND APP LOGIC -->
  <script src="js/vault-sources-standardized.js"></script>
  <script src="js/muet-shared.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Initialize vault selector
    document.addEventListener('DOMContentLoaded', function() {
      const vaultSelector = document.getElementById('vault-selector');
      if (vaultSelector) {
        initVaultSelector(vaultSelector);
      }
    });

    function initVaultSelector(element) {
      const vaults = getAllVaults();
      let html = '<select id="vault-dropdown" class="vault-selector">';
      html += '<option value="">Select a Vault...</option>';
      vaults.forEach(vault => {
        html += `<option value="${vault.id}">${vault.title} (${vault.total_resources} resources)</option>`;
      });
      html += '</select>';
      element.innerHTML = html;

      document.getElementById('vault-dropdown').addEventListener('change', function(e) {
        if (e.target.value) {
          console.log('Selected vault:', e.target.value);
        }
      });
    }
  </script>
</body>
</html>
