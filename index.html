<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18c7b5">
  <title>Smart MUET Guide V2</title>
  <link rel="icon" href="assets/heroes/small-muet-logo.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#18c7b5;color:#101014;font:17px/1.6 system-ui,sans-serif}.entry{max-width:520px;padding:28px;border:3px solid #101014;border-radius:24px;background:#fffaf2;box-shadow:6px 6px 0 #101014}h1{font-size:28px;line-height:1.2;margin:0 0 16px}a{display:inline-block;margin:8px 8px 0 0;padding:12px 18px;border:2px solid #101014;border-radius:12px;background:#ffc400;color:#101014;text-decoration:none;font-weight:800}a:focus-visible{outline:3px solid #0757ff;outline-offset:4px}
  </style>
  <script>
    // Reuse the current multi-page V2 app. Its dashboard and Guide navigation
    // remain in muet-hub.html; registration and practice records are unchanged.
    (() => {
      let returningLearner = false;
      try {
        const profile = JSON.parse(localStorage.getItem('muet_profile') || 'null');
        returningLearner = !!(profile && typeof profile === 'object' &&
          typeof profile.name === 'string' && profile.name.trim() &&
          typeof profile.email === 'string' && profile.email.trim());
      } catch (_) { /* The existing welcome flow remains available. */ }
      window.location.replace(returningLearner ? 'muet-hub.html' : 'splash.html');
    })();
  </script>
</head>
<body>
  <main class="entry">
    <h1>Smart MUET Guide V2</h1>
    <p>Opening your MUET learning journey…</p>
    <p>If the page does not open automatically, choose below.</p>
    <a href="welcome.html">Get started</a>
    <a href="muet-hub.html">Open Home</a>
    <a href="guidance.html">Open Guide</a>
  </main>
</body>
</html>
