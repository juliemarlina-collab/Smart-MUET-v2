<style>
:root{--ink:#111;--white:#fff;--soft:#f4f7f8;--muted:#4f535b;--gold:#FFC400;--cyan:#12D7D7;--lime:#48F000;--red:#ff2525;--line:3px solid var(--ink);--shadow:5px 5px 0 var(--ink);--fh:"Sora",sans-serif;--fb:"DM Sans",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--fb);background:var(--gold);color:var(--ink);overflow-x:hidden}button,input{font:inherit}a{color:inherit;text-decoration:none}
.app{width:100%;max-width:580px;min-height:100dvh;margin:auto;background:var(--soft);padding:15px 14px 112px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:9px}.brand img{width:54px;height:54px}.brand small{display:block;font-size:9px;font-weight:1000;color:var(--muted);letter-spacing:.08em}.brand b{display:block;margin-top:3px;font-family:var(--fh);font-size:17px}.back{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:999px;background:#fff;box-shadow:2px 2px 0 var(--ink);padding:8px 11px;font-size:11px;font-weight:1000}
.hero{background:#fff;border:var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}.hero .tag{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:1000}.hero h1{font-family:var(--fh);font-size:clamp(34px,9vw,48px);line-height:.98;letter-spacing:-.04em;margin-top:9px}.hero h1 span{color:#d89b00;display:block}.hero p{margin-top:9px;font-size:14px;line-height:1.45;font-weight:700;color:#40454c}
.exambar{background:var(--ink);color:#fff;border:var(--line);border-radius:18px;box-shadow:var(--shadow);padding:13px;margin-bottom:14px}.examrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.exambar h2{font-family:var(--fh);font-size:16px}.exambar p{color:#ddd;font-size:10px;line-height:1.4;font-weight:700;margin-top:4px}.timer{font-family:var(--fh);font-size:30px;font-weight:800;white-space:nowrap}.startbtn{width:100%;min-height:48px;margin-top:10px;border:2px solid #fff;border-radius:11px;background:var(--gold);color:#111;font-size:11px;font-weight:1000;cursor:pointer}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:14px}.pstep{height:7px;border:2px solid var(--ink);border-radius:999px;background:#fff}.pstep.on{background:var(--lime)}
.part{display:block;background:#fff;border:var(--line);border-radius:20px;box-shadow:var(--shadow);padding:13px;margin-bottom:14px}.part.active{display:block}.part-head{display:flex;align-items:start;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:2px solid var(--ink)}.part-label{font-size:9px;font-weight:1000;color:var(--muted);letter-spacing:.08em}.part-head h2{font-family:var(--fh);font-size:18px;margin-top:2px}.part-head p{font-size:10px;font-weight:800;color:var(--muted);margin-top:3px}.status{border:2px solid var(--ink);border-radius:999px;background:var(--gold);padding:4px 7px;font-size:8px;font-weight:1000}
.audio-wrap{display:grid;gap:8px;margin-top:10px}.audio-card{border:2px solid var(--ink);border-radius:12px;background:#111;padding:8px;color:#fff}.audio-title{font-family:var(--fh);font-size:11px;margin-bottom:6px}.audio-card iframe{width:100%;height:82px;border:2px solid #fff;border-radius:9px;background:#fff}
.qcard{border:2px solid var(--ink);border-radius:14px;background:#fafafa;padding:11px;margin-top:9px}.qtag{display:inline-block;border:2px solid var(--ink);border-radius:999px;background:var(--gold);padding:4px 7px;font-size:9px;font-weight:1000}.stem{font-size:13px;line-height:1.4;font-weight:900;margin:8px 0}.opts{display:grid;gap:6px}.opt{display:grid;grid-template-columns:20px 1fr;gap:7px;align-items:start;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:9px;font-size:12px;line-height:1.35;font-weight:750}.opt input{margin-top:2px}.opt.correct{background:#dcfce7;border-color:#16803c}.opt.wrong{background:#ffe4e6;border-color:#d92d20}.q7map{display:block;width:100%;max-height:430px;object-fit:contain;border:2px solid var(--ink);border-radius:10px;background:#fff;margin:8px 0}
.part-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.navbtn{min-height:46px;border:var(--line);border-radius:11px;background:var(--gold);box-shadow:3px 3px 0 var(--ink);font-size:10px;font-weight:1000;cursor:pointer}.navbtn.ghost{background:#fff}.part-nav>span{display:block}
.submit-panel{display:none;background:#fff;border:var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px;margin-top:14px}.submit-panel.show{display:block}.submit-panel h2{font-family:var(--fh);font-size:20px}.submit-panel p{font-size:12px;line-height:1.45;font-weight:700;color:var(--muted);margin-top:5px}.submitbtn{width:100%;min-height:50px;margin-top:10px;border:var(--line);border-radius:11px;background:var(--red);color:#fff;box-shadow:4px 4px 0 var(--ink);font-size:11px;font-weight:1000;cursor:pointer}.result{display:none;margin-top:10px;border:2px solid var(--ink);border-radius:12px;background:#e7fff5;padding:11px}.result.show{display:block}.big{font-family:var(--fh);font-size:34px;font-weight:800}.review{display:none;margin-top:12px}.review.show{display:block}
.locked-note{display:block;background:#fff7cc;border:2px solid var(--ink);border-radius:12px;padding:9px;margin-bottom:12px;font-size:11px;font-weight:800}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:calc(100% - 20px);max-width:560px;z-index:70;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:6px}.nav a{min-height:58px;display:grid;place-items:center;align-content:center;gap:3px;border-radius:10px;font-size:9px;font-weight:1000}.nav a.active{background:var(--gold);border:2px solid var(--ink)}.nav img{width:26px;height:26px}
@media(min-width:700px){.app{max-width:850px;padding:24px 24px 120px}.nav{max-width:810px}}

/* ===== Listening Part accordion — aligned with Mock Reading ===== */
.listen-part{
  overflow:hidden;
  background:#fff;
  border:var(--line);
  border-radius:19px;
  box-shadow:var(--shadow);
  margin-bottom:11px;
}
.listen-part-head{
  width:100%;
  min-height:76px;
  border:0;
  background:#eef4ff;
  padding:11px;
  display:grid;
  grid-template-columns:48px 1fr auto;
  gap:9px;
  align-items:center;
  text-align:left;
  cursor:pointer;
}
.listen-part-no{
  width:46px;height:46px;
  display:grid;place-items:center;
  border:2px solid var(--ink);
  border-radius:12px;
  background:#fff;
  font-family:var(--fh);
  font-size:18px;font-weight:800;
}
.listen-part-meta small{
  display:block;
  font-size:9px;
  color:var(--muted);
  font-weight:900;
  letter-spacing:.05em;
}
.listen-part-meta b{
  display:block;
  margin-top:3px;
  font-family:var(--fh);
  font-size:14px;
  line-height:1.24;
}
.listen-part-plus{
  font-size:25px;
  font-weight:1000;
  transition:.15s;
}
.listen-part.open .listen-part-plus{transform:rotate(45deg)}
.listen-part-body{
  display:none;
  border-top:2px solid var(--ink);
}
.listen-part.open .listen-part-body{display:block}

<section class="part " id="part-2">
      <div class="part-head">
        <div><span class="part-label">Part II</span><h2>Talk · Students Working Part-time</h2><p>Questions 8–14</p></div>
        <span class="status" id="status-2">READY</span>
      </div>
      <div class="audio-wrap">
      <div class="audio-card">
        <div class="audio-title">Track 2 · Madam Siti</div>
        <iframe src="https://drive.google.com/file/d/19ktftS7dz8jHJ76NWKhsJw4E8sUdpfbQ/preview" allow="autoplay"></iframe>
      </div></div>
      <div class="questions">
    <div class="qcard">
      <span class="qtag">Q8</span>
      <p class="stem">Madam Siti's son works in a</p>
      
      <div class="opts">
        <label class="opt" id="opt-7-0"><input type="radio" name="q7" value="0"><span>A. university</span></label><label class="opt" id="opt-7-1"><input type="radio" name="q7" value="1"><span>B. supermarket</span></label><label class="opt" id="opt-7-2"><input type="radio" name="q7" value="2"><span>C. fast food restaurant</span></label>
      </div>
    </div>
    <div class="qcard">
      <span class="qtag">Q9</span>
      <p class="stem">Parents should encourage their children to</p>
      
      <div class="opts">
        <label class="opt" id="opt-8-0"><input type="radio" name="q8" value="0"><span>A. do part-time work</span></label><label class="opt" id="opt-8-1"><input type="radio" name="q8" value="1"><span>B. keep some of their wage</span></label><label class="opt" id="opt-8-2"><input type="radio" name="q8" value="2"><span>C. spend on expensive things</span></label>
      </div>
    </div>
    <div class="qcard">
      <span class="qtag">Q10</span>
      <p class="stem">What happens when students miss extracurricular activities due to work?</p>
      
      <div class="opts">
        <label class="opt" id="opt-9-0"><input type="radio" name="q9" value="0"><span>A. They get poor results.</span></label><label class="opt" id="opt-9-1"><input type="radio" name="q9" value="1"><span>B. They miss fun activities.</span></label><label class="opt" id="opt-9-2"><input type="radio" name="q9" value="2"><span>C. They fail to discover their identity.</span></label>
      </div>
    </div>
    <div class="qcard">
      <span class="qtag">Q11</span>
      <p class="stem">What do some irresponsible employers do to students who work part-time?</p>
      
      <div class="opts">
        <label class="opt" id="opt-10-0"><input type="radio" name="q10" value="0"><span>A. They pay students below accepted rate.</span></label><label class="opt" id="opt-10-1"><input type="radio" name="q10" value="1"><span>B. They make students do any job they give.</span></label><label class="opt" id="opt-10-2"><input type="radio" name="q10" value="2"><span>C. They make students work during weekends.</span></label>
      </div>
    </div>
    <div class="qcard">
      <span class="qtag">Q12</span>
      <p class="stem">Employers are looking for young people who are willing to</p>
      
      <div class="opts">
        <label class="opt" id="opt-11-0"><input type="radio" name="q11" value="0"><span>A. remain long in the job</span></label><label class="opt" id="opt-11-1"><input type="radio" name="q11" value="1"><span>B. come to work early</span></label><label class="opt" id="opt-11-2"><input type="radio" name="q11" value="2"><span>C. work hard</span></label>
      </div>
    </div>
    <div class="qcard">
      <span class="qtag">Q13</span>
      <p class="stem">Which communication skill will students learn from working part-time?</p>
      
      <div class="opts">
        <label class="opt" id="opt-12-0"><input type="radio" name="q12" value="0"><span>A. Avoiding mistakes when talking</span></label><label class="opt" id="opt-12-1"><input type="radio" name="q12" value="1"><span>B. Understanding different kinds of people</span></label><label class="opt" id="opt-12-2"><input type="radio" name="q12" value="2"><span>C. Telling co-workers to stay calm during busy hours</span></label>
      </div>
    </div>
    <div class="qcard">
      <span class="qtag">Q14</span>
      <p class="stem">To make a part-time job a success, students should</p>
      
      <div class="opts">
        <label class="opt" id="opt-13-0"><input type="radio" name="q13" value="0"><span>A. swap with co-workers their working hours</span></label><label class="opt" id="opt-13-1"><input type="radio" name="q13" value="1"><span>B. discuss with the boss their responsibilities</span></label><label class="opt" id="opt-13-2"><input type="radio" name="q13" value="2"><span>C. inform the boss of their study hours</span></label>
      </div>
    </div></div>

<script>
document.querySelectorAll(".listen-part-head").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const current=btn.closest(".listen-part");
    document.querySelectorAll(".listen-part").forEach(p=>{
      if(p!==current)p.classList.remove("open");
    });
    current.classList.toggle("open");
    if(current.classList.contains("open")){
      setTimeout(()=>current.scrollIntoView({behavior:"smooth",block:"start"}),60);
    }
  });
});

function openListeningPart(n){
  document.querySelectorAll(".listen-part").forEach(p=>p.classList.remove("open"));
  const target=document.getElementById("listen-accordion-"+n);
  if(target){
    target.classList.add("open");
    setTimeout(()=>target.scrollIntoView({behavior:"smooth",block:"start"}),60);
  }
}


const answers=[0, 2, 2, 1, 0, 0, 1, 1, 1, 2, 0, 2, 1, 2, 4, 2, 1, 0, 1, 0, 1, 2, 1, 0, 1, 1, 2, 1, 0, 0];
let currentPart=1,remaining=3000,timerId=null,started=false,submitted=false;

function showPart(n){
 currentPart=n;
 document.querySelectorAll(".part").forEach((p,i)=>p.classList.toggle("active",i===n-1));
 document.querySelectorAll(".pstep").forEach((p,i)=>p.classList.toggle("on",i<n));
 for(let i=1;i<=5;i++) document.getElementById("status-"+i).textContent=i===n?"CURRENT":i<n?"VISITED":"READY";
 window.scrollTo({top:document.querySelector("#part-"+n).offsetTop-15,behavior:"smooth"});
}
document.querySelectorAll(".next,.prev").forEach(btn=>btn.addEventListener("click",()=>showPart(Number(btn.dataset.target))));
document.getElementById("finishOpen").addEventListener("click",()=>{
 document.getElementById("submitPanel").classList.add("show");
 updateAnswered();
 document.getElementById("submitPanel").scrollIntoView({behavior:"smooth"});
});

function drawTimer(){
 const m=Math.floor(remaining/60),s=remaining%60;
 document.getElementById("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
document.getElementById("startExam").addEventListener("click",()=>{
 if(started)return;
 started=true;
 document.getElementById("startExam").textContent="TIMER RUNNING";
 timerId=setInterval(()=>{
   remaining--; drawTimer();
   if(remaining<=0){
     clearInterval(timerId);
     document.getElementById("submitPanel").classList.add("show");
     submitPaper(true);
   }
 },1000);
});

function updateAnswered(){
 const count=[...Array(30).keys()].filter(i=>document.querySelector(`input[name="q${i}"]:checked`)).length;
 document.getElementById("answeredCount").textContent=count+" of 30 questions answered.";
 return count;
}
document.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",updateAnswered));

function submitPaper(auto=false){
 if(submitted)return;
 const answered=updateAnswered();
 if(!auto && answered<30){
   const ok=confirm(`You answered ${answered} of 30 questions. Submit anyway?`);
   if(!ok)return;
 }
 submitted=true;
 clearInterval(timerId);
 let correct=0;
 for(let i=0;i<30;i++){
   const sel=document.querySelector(`input[name="q${i}"]:checked`);
   const val=sel?Number(sel.value):-1;
   if(val===answers[i])correct++;
   document.querySelectorAll(`input[name="q${i}"]`).forEach(r=>{
     const j=Number(r.value),lab=document.getElementById(`opt-${i}-${j}`);
     if(j===answers[i])lab.classList.add("correct");
     else if(j===val)lab.classList.add("wrong");
     r.disabled=true;
   });
 }
 const score90=Math.round(correct/30*90);
 const box=document.getElementById("result");
 box.classList.add("show");
 box.innerHTML=`<div class="big">${correct}/30</div><div><b>${score90}/90 equivalent listening practice score</b></div><div style="margin-top:6px">${answered} questions answered · Time remaining: ${document.getElementById("timer").textContent}</div><div style="margin-top:8px">Correct answers are now highlighted in green. Your selected incorrect answers are highlighted in red.</div>`;
 localStorage.setItem("muet_mock1_listening","true");
 localStorage.setItem("muet_mock1_listening_score",String(correct));
 document.getElementById("submitExam").disabled=true;
}
document.getElementById("submitExam").addEventListener("click",()=>submitPaper(false));
drawTimer();
</script>
