<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register - Smart MUET Guide">
  <title>Register | Smart MUET Guide</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="css/muet-guide.css">
  <link rel="stylesheet" href="css/display-standard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="page-register">
  <div class="app">
    <header class="brandbar">
      <img src="assets/logo.svg" alt="Smart MUET Guide" class="brand-logo">
      <div class="brand-text">
        <strong>Smart MUET Guide</strong>
        <small>ELU · POLIPD</small>
      </div>
    </header>

    <main class="page">
      <h1>Create Your Account</h1>
      <p>Register to start your MUET practice journey.</p>

      <form id="registerForm" class="form">
        <label>Full Name
          <input id="regName" type="text" required placeholder="e.g. Aisyah Ahmad"/>
        </label>
        <label>Student Email
          <input id="regEmail" type="email" required placeholder="e.g. student@polipd.edu.my"/>
        </label>
        <label>Student Number
          <input id="regNo" type="text" required placeholder="e.g. 06DPR23F1001"/>
        </label>
        <label>Class/Group
          <input id="regGroup" type="text" required placeholder="e.g. DPR3A"/>
        </label>
        <label>Target Band
          <select id="regBand">
            <option value="3.5">Band 3.5</option>
            <option value="4.0" selected>Band 4.0</option>
            <option value="4.5">Band 4.5</option>
            <option value="5.0">Band 5.0</option>
            <option value="5+">Band 5+</option>
          </select>
        </label>
        <button type="submit" class="btn">Create Account</button>
      </form>

      <p style="text-align: center; margin-top: 20px;">
        Already have an account? <a href="welcome-back.html">Sign in</a>
      </p>
    </main>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item"><img src="assets/icon-home.svg" alt=""><span>Home</span></a>
      <a href="progress.html" class="nav-item"><img src="assets/icon-progress.svg" alt=""><span>Progress</span></a>
      <a href="guidance.html" class="nav-item"><img src="assets/icon-guidance.svg" alt=""><span>Guidance</span></a>
      <a href="muet-hub.html" class="nav-item"><img src="assets/icon-practice.svg" alt=""><span>Practice</span></a>
      <a href="settings.html" class="nav-item"><img src="assets/icon-settings.svg" alt=""><span>Settings</span></a>
    </nav>
  </div>

  <script src="js/muet-shared.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
