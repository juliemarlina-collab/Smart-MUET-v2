<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="assets/heroes/small-muet-logo.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feedback · Smart MUET Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/phase1-clean.css">
  <link rel="stylesheet" href="css/responsive-v2.css">
</head>
<body><main class="app">
<header class="topbar"><div class="brand"><img src="assets/heroes/small-muet-logo.svg" alt="Smart MUET Guide"><div><small>SMART MUET GUIDE · PHASE 1</small><strong>Feedback</strong></div></div><a class="back" href="muet-hub.html">Home</a></header>

<section class="card pink"><span class="kicker">PILOT FEEDBACK</span><h1>Feedback</h1><p class="lead">A short reflection after using Smart MUET Guide helps us improve the exam-ready experience.</p></section>
<section class="card">
<label style="font-weight:900">How ready do you feel for MUET?</label>
<select style="width:100%;padding:12px;border:3px solid var(--ink);border-radius:12px;margin:7px 0 12px"><option>Not ready yet</option><option>Getting there</option><option>Almost ready</option><option>Ready</option></select>
<label style="font-weight:900">What helped you most?</label>
<textarea rows="4" style="width:100%;padding:12px;border:3px solid var(--ink);border-radius:12px;margin:7px 0 12px"></textarea>
<button class="btn" type="button" id="submitFeedback">Submit Feedback</button><div id="feedbackSaved" class="tip" style="display:none;margin-top:10px">Feedback saved locally ✓</div>
</section>

</main><nav class="nav"><a href="muet-hub.html" class=""><img src="assets/heroes/nav-home.svg" alt=""><span>Home</span></a><a href="guidance.html" class=""><img src="assets/heroes/icon-muet-intro.svg" alt=""><span>Guide</span></a><a href="vault.html" class=""><img src="assets/heroes/nav-vault.svg" alt=""><span>Vault</span></a><a href="progress.html" class=""><img src="assets/heroes/nav-progress.svg" alt=""><span>Progress</span></a><a href="settings.html" class="active"><img src="assets/heroes/nav-profile.svg" alt=""><span>Profile</span></a></nav><script src="js/phase1-state.js"></script><script>
document.getElementById('submitFeedback')?.addEventListener('click',()=>{
  const entry={timestamp:new Date().toISOString(),page:'feedback'};
  const log=JSON.parse(localStorage.getItem('muet_feedback')||'[]');
  log.push(entry);localStorage.setItem('muet_feedback',JSON.stringify(log));
  document.getElementById('feedbackSaved').style.display='block';
});
</script></body></html>
