<body class="page-part8-feedback"><main class="app">
<header class="topbar"><div class="brand"><img src="assets/heroes/small-muet-logo.svg" alt="Smart MUET Guide"><div><small>SMART MUET GUIDE · PHASE 1</small><strong>Feedback</strong></div></div><a class="back" href="muet-hub.html">Home</a></header>

<section class="card pink"><span class="kicker">PILOT FEEDBACK</span><h1>Feedback</h1><p class="lead">A short reflection after using Smart MUET Guide helps us improve the exam-ready experience.</p></section>

</main><nav class="nav"><a href="muet-hub.html" class=""><img src="assets/heroes/nav-home.svg" alt=""><span>Home</span></a><a href="guidance.html" class=""><img src="assets/heroes/icon-muet-intro.svg" alt=""><span>Guide</span></a><a href="vault.html" class=""><img src="assets/heroes/nav-vault.svg" alt=""><span>Vault</span></a><a href="progress.html" class=""><img src="assets/heroes/nav-progress.svg" alt=""><span>Progress</span></a><a href="settings.html" class="active"><img src="assets/heroes/nav-profile.svg" alt=""><span>Profile</span></a></nav><script src="js/phase1-state.js"></script><script>
document.getElementById('submitFeedback')?.addEventListener('click',()=>{
